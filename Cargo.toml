[package]
name = "priqi_iced"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
iced = { git = "https://github.com/iced-rs/iced", branch = "master", version = "0.15.0-dev" }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["sqlite", "runtime-tokio", "chrono"] }
tokio = { version = "1.54.0", features = ["full"] }
